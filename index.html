<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f6ecd9" />
    <meta name="description" content="A calm seaside sand-sort puzzle." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Strata" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Strata</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='3' width='14' height='26' rx='5' fill='%23fff8' stroke='%235a4632' stroke-width='2'/%3E%3Crect x='10' y='20' width='12' height='8' rx='3' fill='%23c8553d'/%3E%3Crect x='10' y='13' width='12' height='7' fill='%23f2a541'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud-title">
          <span class="brand"><span class="brand-name">Strata</span> <em id="challenge-tag" class="tag" hidden>Tall jars</em></span>
          <span id="level-label" class="level-label">Level 1</span>
        </div>
        <div class="coins" id="coins-chip" aria-live="polite"><i class="coin" aria-hidden="true"></i><span id="coins">0</span></div>
        <button id="btn-restart" class="icon-btn" type="button" title="Restart (R)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></svg>
        </button>
        <button id="btn-settings" class="icon-btn" type="button" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></svg>
        </button>
      </header>
      <div class="subhud"><span id="moves">0</span> <span id="moves-label">pours</span></div>
      <main id="board" class="board" aria-label="Sand jars"></main>
      <div id="coach" class="coach" hidden aria-live="polite"><span class="coach-ring" aria-hidden="true"></span><span id="coach-text" class="coach-text"></span></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <nav class="toolbar" aria-label="Boosters">
        <button id="btn-undo" class="tool" type="button" data-booster="undo" title="Undo (Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
          <span class="tool-name">Undo</span><b class="badge"></b>
        </button>
        <button id="btn-shuffle" class="tool" type="button" data-booster="shuffle" title="Shuffle (S)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5" /><path d="M4 20 21 3" /><path d="M21 16v5h-5" /><path d="m15 15 6 6" /><path d="M4 4l5 5" /></svg>
          <span class="tool-name">Shuffle</span><b class="badge"></b>
        </button>
        <button id="btn-jar" class="tool" type="button" data-booster="extraJar" title="Add an empty jar (J)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8M9 3v3.5c-2 1-3 2.6-3 4.5v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8c0-1.9-1-3.5-3-4.5V3" /><path d="M12 11v6M9 14h6" /></svg>
          <span class="tool-name">Jar</span><b class="badge"></b>
        </button>
        <button id="btn-hint" class="tool" type="button" data-booster="hint" title="Hint (H)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4" /><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z" /></svg>
          <span class="tool-name">Hint</span><b class="badge"></b>
        </button>
      </nav>
      <div id="win" class="win" hidden>
        <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
          <div class="win-jars" aria-hidden="true"><i></i><i></i><i></i></div>
          <h2 id="win-title">Level cleared</h2>
          <p id="win-text">All jars sorted.</p>
          <div id="win-reward" class="win-reward"><i class="coin" aria-hidden="true"></i><span id="win-coins">+20</span></div>
          <p id="win-note" class="win-note"></p>
          <div id="win-shell" class="win-shell" hidden><span id="win-shell-art" class="win-shell-art"></span><span id="win-shell-text"></span></div>
          <button id="btn-share" class="secondary share" type="button" hidden>Share</button>
          <button id="btn-next" class="primary" type="button">Continue</button>
        </div>
      </div>
      <div id="settings" class="sheet" hidden>
        <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <h2 id="settings-title">Settings</h2>
          <label class="toggle"><span data-s="sound">Sound effects</span><input type="checkbox" id="set-sound" /></label>
          <label class="toggle"><span data-s="music">Music</span><input type="checkbox" id="set-music" /></label>
          <label class="toggle"><span data-s="haptics">Vibration</span><input type="checkbox" id="set-haptics" /></label>
          <label class="toggle"><span data-s="patterns">Colour patterns</span><input type="checkbox" id="set-patterns" /></label>
          <div class="sheet-row">
            <button id="btn-home" class="secondary" type="button">Home</button>
            <button id="btn-tutorial" class="secondary" type="button">Replay tutorial</button>
            <button id="btn-guide" class="secondary" type="button">Jar guide</button>
          </div>
          <button id="btn-close-settings" class="primary" type="button">Close</button>
        </div>
      </div>
      <div id="intro" class="cabinet" hidden>
        <div class="cabinet-card intro-card" role="dialog" aria-modal="true" aria-labelledby="intro-title">
          <p id="intro-kicker" class="intro-kicker">New jar!</p>
          <div id="intro-list"></div>
          <button id="btn-intro-ok" class="primary" type="button">Got it</button>
        </div>
      </div>
      <div id="cabinet" class="cabinet" hidden>
        <div class="cabinet-card" role="dialog" aria-modal="true" aria-labelledby="cabinet-title">
          <div class="cabinet-head"><h2 id="cabinet-title">Shell cabinet</h2><button id="btn-close-cabinet" class="icon-btn" type="button" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg></button></div>
          <p id="cabinet-next" class="cabinet-next"></p>
          <div id="cabinet-sets"></div>
        </div>
      </div>
      <div id="home" class="home" hidden>
        <div class="home-inner">
          <div class="logo-jars" aria-hidden="true"><i></i><i></i><i></i></div>
          <h1 id="home-title" class="home-title">Strata</h1>
          <p id="home-tagline" class="home-tagline">Sort the sand. Seal the jars.</p>
          <div class="coins home-coins"><i class="coin" aria-hidden="true"></i><span id="home-coins">0</span></div>
          <button id="btn-play" class="primary play" type="button">Play</button>
          <button id="btn-daily" class="daily-card" type="button">
            <span class="daily-cal" aria-hidden="true"><b id="daily-dow">Sun</b><i id="daily-dom">8</i></span>
            <span class="daily-text"><strong id="daily-title">Daily puzzle</strong><span id="daily-sub">Today: hard</span><span id="daily-streak" class="daily-streak">Start a streak today</span></span>
          </button>
          <button id="btn-shells" class="secondary shells-btn" type="button"><span class="shell-ico" id="shell-ico" aria-hidden="true"></span><span id="shells-label">Shells 0/20</span></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
