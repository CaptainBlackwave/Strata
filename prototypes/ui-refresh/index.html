<!doctype html>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!-- Question: Which visual direction (A Sea glass, B Beach-hut tactile, C Tide-line editorial) should Strata's UI refresh take? -->
<!-- Date: 2026-11-12 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata UI refresh: three directions</title>
<style>
/* ============================================================
   TOKEN FOUNDATION (shared by all directions)
   type: 6 steps  | space: 4-pt scale | radii: 4 | shadows: 3 levels | motion: 3 durations
   --u is "one CSS px at the current text size" so 150% text scales every token.
   ============================================================ */
:root{
  --w:390px; --h:844px; --ts:1; --ws:1;
  --u:calc(1px * var(--ts));
  --gut:calc(var(--w) * .05);
  /* type scale: 12 / 14 / 16 / 20 / 28 / 40 (title also capped by phone width so 150% never overflows) */
  --t-xs:calc(12*var(--u)); --t-sm:calc(14*var(--u)); --t-md:calc(16*var(--u));
  --t-lg:calc(20*var(--u)); --t-xl:calc(28*var(--u));
  --t-2xl:min(calc(40*var(--u)), calc(var(--w) * .115));
  /* spacing (4-pt) */
  --s1:calc(4*var(--u)); --s2:calc(8*var(--u)); --s3:calc(12*var(--u));
  --s4:calc(16*var(--u)); --s5:calc(24*var(--u)); --s6:calc(32*var(--u));
  /* motion (not animated in this static mock; documented for the real token set) */
  --m-fast:160ms; --m-base:240ms; --m-slow:400ms;
  --r-pill:999px;
}
:root[data-w=narrow]{--w:320px;--h:700px;--ts:1.5;--ws:.82}

/* ---------- scene tokens: colour + per-scene shadow colour ---------- */
:root[data-scene=light]{
  --bg1:#fbf3e4; --bg2:#f1dfc1; --sea:#b9e0d6; --ink:#4a3b2c; --ink2:#7d6a55;
  --card:#fffaf1; --surf2:#f1e6d3; --accent:#2a9d8f; --acc-ink:#fff; --acc-text:#1a6b61;
  --coral:#c8553d; --coral-text:#b3412b; --toast-bg:#4a3b2c; --toast-fg:#fff;
  --glass:rgba(255,255,255,.2); --jar-edge:rgba(90,70,50,.5);
  --hair:rgba(74,59,44,.14); --edge-hi:rgba(255,255,255,.85); --edge-lo:rgba(90,70,50,.14);
  --shadow:90 70 50; --lipmix:#8a5a2b; --glow:255 236 170; --chip:rgba(255,255,255,.7);
  --band-teal:#9fd8cb; --band-coral:#f5ae9b; --band-sand:#efd49f; --band-blue:#a8cdea;
  --stage:#d8d1c3; --gold:#f2a541;
}
:root[data-scene=dark]{
  --bg1:#0e1a30; --bg2:#1d3150; --sea:#18465a; --ink:#f1ead9; --ink2:#b6c2d1;
  --card:#1b2a44; --surf2:#24365a; --accent:#4fc3b0; --acc-ink:#0e1a30; --acc-text:#4fc3b0;
  --coral:#ff9a85; --coral-text:#ff9a85; --toast-bg:#f1ead9; --toast-fg:#1b2a44;
  --glass:rgba(255,255,255,.1); --jar-edge:rgba(214,226,242,.6);
  --hair:rgba(214,226,242,.16); --edge-hi:rgba(255,255,255,.14); --edge-lo:rgba(0,0,0,.35);
  --shadow:2 6 16; --lipmix:#000; --glow:120 150 220; --chip:rgba(255,255,255,.1);
  --band-teal:#1f6a67; --band-coral:#8d4a44; --band-sand:#7b6642; --band-blue:#2d5a8c;
  --stage:#070c16; --gold:#f2b457;
}
/* elevation: 3 levels, same recipe, shadow colour comes from the scene */
:root{
  --sh1:0 1px 0 var(--edge-hi), 0 calc(2*var(--u)) calc(6*var(--u)) rgb(var(--shadow) / .10);
  --sh2:0 1px 0 var(--edge-hi), 0 calc(8*var(--u)) calc(24*var(--u)) rgb(var(--shadow) / .16);
  --sh3:0 1px 0 var(--edge-hi), 0 calc(20*var(--u)) calc(48*var(--u)) rgb(var(--shadow) / .30);
  --lip:color-mix(in srgb, var(--card) 72%, var(--lipmix));
  --accent-lip:color-mix(in srgb, var(--accent) 66%, #000);
}

/* ---------- direction A: Sea glass ---------- */
:root[data-dir=A]{
  --font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-d:var(--font); --w-title:800; --w-body:500;
  --r-sm:10px; --r-btn:16px; --r-card:22px; --r-sheet:28px; --r-ico:50%;
  --card-bg:color-mix(in srgb, var(--card) 74%, transparent); --card-img:none;
  --card-bd:1px solid var(--edge-hi); --card-sh:var(--sh2); --blur:blur(14px) saturate(1.25);
  --card-pad:var(--s4); --card-gap:var(--s3);
  --ico-bg:color-mix(in srgb, var(--accent) 16%, transparent); --ico-sh:none; --sw:2; --icon-fill:none;
  --btn-bg:linear-gradient(180deg, color-mix(in srgb, var(--accent) 86%, #fff), var(--accent));
  --btn-fg:var(--acc-ink);
  --btn-sh:0 0 0 calc(4*var(--u)) color-mix(in srgb, var(--accent) 20%, transparent), 0 calc(10*var(--u)) calc(24*var(--u)) color-mix(in srgb, var(--accent) 38%, transparent), inset 0 1px 0 rgba(255,255,255,.45);
  --sec-bg:var(--chip); --sec-sh:inset 0 0 0 1px var(--edge-hi);
  --hdr-bg:transparent; --hdr-r:0; --title-w:var(--w-title); --title-sz:var(--t-2xl); --hero-align:center;
  --phone-bg:radial-gradient(120% 38% at 50% 104%, color-mix(in srgb, var(--sea) 70%, transparent), transparent 72%), linear-gradient(180deg, var(--bg1), var(--bg2));
  --tab-bg:color-mix(in srgb, var(--card) 70%, transparent); --tab-r:26px; --tab-m:0 var(--gut) var(--s3); --tab-bd:1px solid var(--edge-hi); --tab-sh:var(--sh2);
  --tab-on-bg:color-mix(in srgb, var(--accent) 22%, transparent); --tab-on-sh:none;
  --jar-bd:1.5px solid var(--jar-edge); --jar-r:9px 9px 24px 24px; --jar-bg:linear-gradient(90deg, rgba(255,255,255,.22), rgba(255,255,255,0) 40%, rgba(255,255,255,.1));
  --rim-bg:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.4)); --rim-h:calc(6px*var(--ws)); --rim-ex:6px;
  --shelf-h:calc(10px*var(--ws)); --shelf-bg:linear-gradient(180deg, color-mix(in srgb, var(--sea) 85%, #fff), color-mix(in srgb, var(--sea) 40%, transparent)); --shelf-r:99px;
  --bst-bg:var(--card-bg); --bst-sh:var(--sh1); --bst-bd:1px solid var(--edge-hi);
}
/* ---------- direction B: Beach-hut tactile ---------- */
:root[data-dir=B]{
  --font:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;
  --font-d:var(--font); --w-title:900; --w-body:600;
  --r-sm:10px; --r-btn:16px; --r-card:18px; --r-sheet:24px; --r-ico:13px;
  --card-bg:var(--card); --card-img:radial-gradient(rgba(138,90,43,.07) 1px, transparent 1.3px);
  --card-bd:2px solid color-mix(in srgb, var(--card) 70%, var(--lipmix));
  --card-sh:0 calc(4*var(--u)) 0 var(--lip), 0 calc(10*var(--u)) calc(14*var(--u)) calc(-6*var(--u)) rgb(var(--shadow) / .30); --blur:none;
  --card-pad:var(--s4); --card-gap:var(--s4);
  --ico-bg:color-mix(in srgb, var(--accent) 28%, var(--card)); --ico-sh:inset 0 -3px 0 color-mix(in srgb, var(--accent) 40%, transparent); --sw:2.25;
  --icon-fill:color-mix(in srgb, var(--accent) 38%, transparent);
  --btn-bg:var(--accent); --btn-fg:var(--acc-ink);
  --btn-sh:0 calc(5*var(--u)) 0 var(--accent-lip), 0 calc(10*var(--u)) calc(14*var(--u)) calc(-4*var(--u)) rgb(var(--shadow) / .4), inset 0 2px 0 rgba(255,255,255,.35);
  --sec-bg:var(--card); --sec-sh:0 calc(4*var(--u)) 0 var(--lip), inset 0 0 0 2px color-mix(in srgb, var(--card) 70%, var(--lipmix));
  --hdr-bg:var(--band); --hdr-r:0 0 24px 24px; --title-w:900; --title-sz:var(--t-2xl); --hero-align:center;
  --phone-bg:radial-gradient(rgba(138,90,43,.06) 1px, transparent 1.4px) 0 0/8px 8px, linear-gradient(180deg, var(--bg1), var(--bg2));
  --tab-bg:var(--card); --tab-r:22px 22px 0 0; --tab-m:0; --tab-bd:2px solid color-mix(in srgb, var(--card) 70%, var(--lipmix)); --tab-sh:0 calc(-4*var(--u)) 0 var(--lip);
  --tab-on-bg:var(--band); --tab-on-sh:inset 0 -3px 0 rgb(var(--shadow) / .25);
  --jar-bd:3px solid var(--jar-edge); --jar-r:7px 7px 18px 18px; --jar-bg:linear-gradient(90deg, rgba(255,255,255,.28), rgba(255,255,255,0) 35%);
  --rim-bg:linear-gradient(180deg, #d9a66b, #b07a42); --rim-h:calc(9px*var(--ws)); --rim-ex:4px;
  --shelf-h:calc(14px*var(--ws)); --shelf-bg:linear-gradient(180deg, #d9b27a, #b58a52); --shelf-r:8px;
  --bst-bg:var(--card); --bst-sh:0 calc(4*var(--u)) 0 var(--lip); --bst-bd:2px solid color-mix(in srgb, var(--card) 70%, var(--lipmix));
}
/* ---------- direction C: Tide-line editorial ---------- */
:root[data-dir=C]{
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-d:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif; --w-title:500; --w-body:400;
  --r-sm:6px; --r-btn:12px; --r-card:0; --r-sheet:28px; --r-ico:0;
  --card-bg:transparent; --card-img:none; --card-bd:0 solid transparent; --card-sh:none; --blur:none;
  --card-pad:var(--s4) 0; --card-gap:0;
  --ico-bg:transparent; --ico-sh:none; --sw:1.5; --icon-fill:none;
  --btn-bg:var(--ink); --btn-fg:var(--bg1);
  --btn-sh:inset 0 calc(-3*var(--u)) 0 var(--accent);
  --sec-bg:transparent; --sec-sh:inset 0 0 0 1px var(--hair);
  --hdr-bg:transparent; --hdr-r:0; --title-w:500; --title-sz:var(--t-2xl); --hero-align:left;
  --phone-bg:var(--bg1);
  --tab-bg:transparent; --tab-r:0; --tab-m:0; --tab-bd:0 solid transparent; --tab-sh:0 -1px 0 var(--hair);
  --tab-on-bg:transparent; --tab-on-sh:none;
  --jar-bd:1.25px solid var(--jar-edge); --jar-r:3px 3px 16px 16px; --jar-bg:none;
  --rim-bg:transparent; --rim-h:0px; --rim-ex:0px;
  --shelf-h:1px; --shelf-bg:var(--ink2); --shelf-r:0;
  --bst-bg:transparent; --bst-sh:none; --bst-bd:1px solid var(--hair);
}

/* ============================================================
   MOCK-UP CHROME (not part of the design)
   ============================================================ */
*{box-sizing:border-box}
body{margin:0;background:var(--stage);font:14px system-ui,sans-serif;color:#222}
:root[data-scene=dark] body{color:#ddd}
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;padding:10px;background:rgba(20,20,20,.88);backdrop-filter:blur(8px);color:#fff}
.seg{display:inline-flex;border:1px solid #666;border-radius:999px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font-weight:700;color:#ddd}
.seg button[aria-pressed=true]{background:#fff;color:#111}
.bar small{opacity:.7}
.stage{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;align-items:flex-start;padding:28px 12px 60px}
.slot{display:flex;flex-direction:column;gap:8px;align-items:center}
.slot>span{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;opacity:.7}

/* ============================================================
   PRODUCT CSS (everything below reads only tokens)
   ============================================================ */
.phone{position:relative;width:var(--w);min-height:var(--h);display:flex;flex-direction:column;overflow:hidden;border-radius:38px;
  background:var(--phone-bg);color:var(--ink);font:var(--w-body) var(--t-md)/1.4 var(--font);
  box-shadow:0 30px 60px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.15)}
.phone *{min-width:0;overflow-wrap:normal;word-break:normal;hyphens:manual}
.phone svg{width:calc(22*var(--u));height:calc(22*var(--u));flex:none;stroke:currentColor;stroke-width:var(--sw);fill:none;stroke-linecap:round;stroke-linejoin:round}
.phone svg.f{fill:var(--icon-fill)}
:root[data-scene=dark] .phone::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;
  background:radial-gradient(1.2px 1.2px at 12% 9%,#fff,transparent),radial-gradient(1px 1px at 33% 5%,#fff,transparent),radial-gradient(1.2px 1.2px at 58% 13%,#fff,transparent),radial-gradient(1px 1px at 88% 7%,#fff,transparent),radial-gradient(1px 1px at 72% 20%,#fff,transparent),radial-gradient(1px 1px at 20% 24%,#fff,transparent)}
:root[data-dir=C][data-scene=dark] .phone::before{opacity:.25}
.phone>*{position:relative}

.top{display:flex;align-items:center;gap:var(--s2);padding:calc(20*var(--u)) var(--gut) var(--s3);background:var(--hdr-bg);border-radius:var(--hdr-r)}
:root[data-dir=B] .top{box-shadow:0 calc(4*var(--u)) 0 color-mix(in srgb, var(--band) 70%, #000), 0 8px 12px -6px rgb(var(--shadow) / .3);padding-bottom:var(--s4)}
.top .grow{flex:1}
.top .h2.grow{flex:1 0 auto}
:root[data-w=narrow] .top .chip{font-size:var(--t-xs);padding:var(--s1) var(--s2)}
.top .stk{flex:1;display:flex;flex-direction:column}
.chip{display:inline-flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s3);min-height:calc(36*var(--u));border-radius:var(--r-pill);
  background:var(--chip);border:1px solid var(--edge-hi);box-shadow:var(--sh1);font-weight:800;font-size:var(--t-sm);font-variant-numeric:tabular-nums;white-space:nowrap}
:root[data-dir=C] .chip{background:transparent;border:0;box-shadow:none;padding:0}
:root[data-dir=B] .chip{background:var(--card);border:2px solid color-mix(in srgb, var(--card) 70%, var(--lipmix));box-shadow:0 3px 0 var(--lip)}
.coin{width:calc(16*var(--u));height:calc(16*var(--u));border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 60%,#c98418);box-shadow:inset 0 0 0 1.5px rgba(120,70,0,.35)}
.ava{width:calc(40*var(--u));height:calc(40*var(--u));border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--edge-hi);box-shadow:var(--sh1);flex:none}
:root[data-dir=C] .ava{box-shadow:none;border:1px solid var(--hair);background:transparent}
.ava i{display:block;width:calc(12*var(--u));height:calc(22*var(--u));border:2px solid var(--jar-edge);border-radius:3px 3px 7px 7px;background:linear-gradient(#c8553d 33%,#f2a541 33% 66%,#2a9d8f 66%)}
:root[data-w=narrow] .name{display:none}
.iconbtn{all:unset;box-sizing:border-box;display:grid;place-items:center;width:calc(40*var(--u));height:calc(40*var(--u));border-radius:var(--r-btn);color:var(--ink);
  background:var(--chip);border:1px solid var(--edge-hi);box-shadow:var(--sh1);flex:none}
:root[data-dir=B] .iconbtn{background:var(--card);border:2px solid color-mix(in srgb, var(--card) 70%, var(--lipmix));box-shadow:0 3px 0 var(--lip)}
:root[data-dir=C] .iconbtn{background:transparent;border:0;box-shadow:none;width:calc(36*var(--u))}

.eyebrow{font-size:var(--t-xs);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.h1{font:var(--title-w) var(--title-sz)/1.05 var(--font-d);letter-spacing:-.01em;margin:0}
:root[data-dir=C] .h1,:root[data-dir=C] .h2{letter-spacing:-.02em}
.h2{font:var(--title-w) var(--t-lg)/1.2 var(--font-d);margin:0}
.h3{font:800 var(--t-md)/1.25 var(--font);margin:0}
:root[data-dir=C] .h3{font-family:var(--font-d);font-weight:600}
.sub{font-size:var(--t-sm);color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
:root[data-dir=C] .num-big{font-family:var(--font-d);font-weight:500}

/* hero */
.hero{padding:var(--s2) var(--gut) 0;text-align:var(--hero-align);display:flex;flex-direction:column;gap:var(--s1)}
.sky{position:absolute;right:var(--gut);top:calc(6*var(--u));width:calc(46*var(--u));height:calc(46*var(--u));border-radius:50%;
  background:radial-gradient(circle, rgb(var(--glow) / .95) 0 36%, rgb(var(--glow) / 0) 70%);z-index:0}
:root[data-scene=dark] .sky{background:radial-gradient(circle at 36% 38%,#fbf8ee 0 54%,#d8d0bb 56% 100%);width:calc(26*var(--u));height:calc(26*var(--u));top:calc(18*var(--u));right:calc(24*var(--u));box-shadow:0 0 calc(28*var(--u)) rgb(var(--glow) / .5)}
:root[data-dir=C] .sky{opacity:.8}
.hero>*{z-index:1}
.logo{display:flex;justify-content:center;align-items:flex-end;gap:calc(16px*var(--ws));margin:var(--s5) 0 0;padding-bottom:0;position:relative}
.logo .jar{--jw:calc(72px*var(--ws));--jh:calc(132px*var(--ws))}
.logo .jar:nth-child(2){--jh:calc(160px*var(--ws))}
.shelfwrap{position:relative}
.shelfwrap::after{content:"";position:absolute;left:0;right:0;bottom:calc(-1*var(--shelf-h));height:var(--shelf-h);background:var(--shelf-bg);border-radius:var(--shelf-r)}
:root[data-dir=A] .shelfwrap::after{left:calc(-1*var(--gut));right:calc(-1*var(--gut));height:calc(26*var(--u));bottom:calc(-20*var(--u));filter:blur(.5px);opacity:.8;border-radius:50%}
:root[data-dir=B] .shelfwrap::after{box-shadow:0 3px 0 #8f6736}
.play{margin:calc(18*var(--u)) var(--gut) 0}
.btn{all:unset;box-sizing:border-box;display:flex;justify-content:center;align-items:center;gap:var(--s2);text-align:center;min-height:calc(52*var(--u));padding:var(--s3) var(--s5);
  border-radius:var(--r-btn);background:var(--btn-bg);color:var(--btn-fg);font:var(--w-title) var(--t-md)/1.2 var(--font);box-shadow:var(--btn-sh);cursor:pointer}
:root[data-dir=C] .btn{font-family:var(--font);font-weight:700;letter-spacing:.02em}
.btn.sec{background:var(--sec-bg);color:var(--ink);box-shadow:var(--sec-sh);min-height:calc(44*var(--u));font-weight:800}
.btn.sm{min-height:calc(40*var(--u));padding:var(--s2) var(--s4);font-size:var(--t-sm)}
.btn:active{transform:translateY(2px)}
.linkbtn{display:inline-flex;align-items:center;gap:var(--s1);font-weight:800;font-size:var(--t-sm);color:var(--acc-text);text-decoration:none;min-height:calc(36*var(--u))}
.linkbtn svg{width:calc(16*var(--u));height:calc(16*var(--u))}

/* cards */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);padding:var(--s5) var(--gut) var(--s2)}
.stack{display:flex;flex-direction:column;gap:var(--card-gap);padding:0 var(--gut)}
.card{background:var(--card-bg);background-image:var(--card-img);background-size:7px 7px;border:var(--card-bd);border-radius:var(--r-card);box-shadow:var(--card-sh);
  padding:var(--card-pad);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
:root[data-dir=C] .card{border-top:1px solid var(--hair)}
:root[data-dir=C] .stack .card:last-child{border-bottom:1px solid var(--hair)}
.row{display:flex;align-items:center;gap:var(--s3)}
.row .grow{flex:1;min-width:0}
.ico{display:grid;place-items:center;width:calc(40*var(--u));height:calc(40*var(--u));flex:none;border-radius:var(--r-ico);background:var(--ico-bg);box-shadow:var(--ico-sh);color:var(--acc-text)}
:root[data-dir=C] .ico{width:calc(28*var(--u));justify-content:start}
.ico.coral{color:var(--coral-text);background:color-mix(in srgb, var(--coral) 18%, transparent)}
:root[data-dir=C] .ico.coral{background:transparent}
.daily{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3)}
.daily .dtxt{flex:1 1 calc(80*var(--u))}
.daily .btn{flex:0 0 auto}
:root[data-w=narrow] .daily .btn{flex:1 1 100%}
.date{width:calc(48*var(--u));text-align:center;border-radius:var(--r-sm);overflow:hidden;background:var(--card);box-shadow:inset 0 0 0 1px var(--hair);flex:none}
.date span{display:block;font-size:calc(10*var(--u));font-weight:800;letter-spacing:.08em;background:var(--coral);color:var(--card);padding:calc(2*var(--u)) 0}
:root[data-scene=light] .date span{color:#fff}
.date b{display:block;font:800 var(--t-lg)/1.3 var(--font);font-variant-numeric:tabular-nums}
:root[data-dir=C] .date{background:transparent;border-radius:0}
:root[data-dir=C] .date span{background:transparent;color:var(--coral-text)}
:root[data-dir=C] .date b{font-family:var(--font-d);font-weight:500;font-size:var(--t-xl);line-height:1}
:root[data-w=narrow] .date{display:none}
.dinline{display:none}
:root[data-w=narrow] .dinline{display:inline}
.chev{color:var(--ink2)}

   <div class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><h2 class="h3">Today's goals</h2><span class="sub num">1 of 3</span></div>
    <div class="goal"><div class="row"><div class="grow h3" style="font-weight:700">Solve today's daily</div><span class="reward">+20</span></div><div class="bar-t"><i style="width:0%"></i></div></div>
    <div class="goal"><div class="row"><div class="grow h3" style="font-weight:700">Clear a level Perfect</div><span class="reward">+30</span></div><div class="bar-t"><i style="width:100%"></i></div></div>
    <div class="goal"><div class="row"><div class="grow h3" style="font-weight:700">All of today's goals</div><span class="reward">+50</span></div><div class="bar-t"><i style="width:33%"></i></div></div></div>
   <div class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><h2 class="h3">Weekly boards</h2><span class="sub num">3 of 5 cleared</span></div>
    <div class="boards">${['tatt','ccaa','bbgg','vvss','pa'].map((c,i) => `<div class="bd ${i<3?'ok':''}">${i<3?jar('tatt'.replace(/./g,c[0]),'sealed'):jar(c)}<span>${i<3?'Cleared':'Play'}</span></div>`).join('')}</div>
    <div class="caption">New boards in 3 days.</div></div>
  </div><div style="height:var(--s4)"></div>${tabs('Today')}</div>`;

const field = () => {
  const rows = [['tacp','bttg','ccc','pabg'],['gsv','tttt|sealed','vb','']];
  return `<div class="field">${rows.map((r, ri) => `<div class="jrow">${r.map((j, ji) => { const [c, cl] = j.split('|'); return jar(c, (cl || '') + (ri === 0 && ji === 1 ? ' lift' : '')); }).join('')}</div>`).join('')}</div>`;
};
const hud = () => `<div class="hud" style="--band:var(--band-blue)"><div class="r1"><div><div class="eyebrow">Strata</div><div class="lvl num-big">Level 250</div></div><div style="text-align:right"><span class="tag">Tall jars</span><div class="pours"><b class="num">12</b> pours</div></div></div>
  <div class="r2"><span class="row" style="gap:var(--s2)"><button class="iconbtn" aria-label="Restart">${ic('restart', 0)}</button><button class="iconbtn" aria-label="Settings">${ic('gear', 1)}</button></span>${coinChip('98,765')}</div></div>`;
const boost = () => `<div class="boost">${[['undo','Undo',0],['shuffle','Shuffle',12],['jar','Jar',6],['hint','Hint',15]].map(([i,l,n]) => `<div class="bst">${n ? `<span class="cnt">${n}</span>` : ''}${ic(i, i==='jar'||i==='hint')}${l}</div>`).join('')}</div>`;
const board = () => `<div class="phone" id="s-board">${hud()}${field()}<div class="toast">That jar is full</div>${boost()}</div>`;
const win = () => `<div class="phone" id="s-win" style="--band:var(--band-sand)"><div class="dim">${hud()}${field()}<div style="height:var(--s5)"></div>${boost()}</div><div class="scrim"></div>
  <div class="wincard"><div class="trio">${jar('tatt')}${jar('ccaa')}${jar('aapp')}</div>
   <div><h1 class="h1" style="font-size:var(--t-xl)">Perfect!</h1><div class="sub" style="margin-top:var(--s1)">8 pours · New best: 8 pours</div></div>
   <span class="coinpill"><i class="coin"></i>+100 coins</span>
   <div class="checks"><div class="chk"><span class="tk">${ic('check')}</span><span class="grow">Goal done: Solve today's daily</span><em>+20</em></div>
    <div class="chk"><span class="medal"></span><span class="grow">New badge: Beachcomber</span></div></div>
   <div class="actions"><button class="btn">Continue</button><div class="links"><a class="linkbtn">Home</a><a class="linkbtn">${ic('share')} Challenge a friend</a></div></div></div></div>`;

const screens = [['Home / Play tab', home], ['Today tab', today], ['Board', board], ['Win card', win]];
document.getElementById('stage').innerHTML = screens.map(([l, f]) => `<div class="slot"><span>${l}</span>${f()}</div>`).join('');

// switchers (also settable via ?dir=A&scene=dark&w=narrow)
const root = document.documentElement, q = new URLSearchParams(location.search);
const set = (k, v) => { root.dataset[k] = v; document.querySelectorAll(`#sg-${k} button`).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); };
set('dir', q.get('dir') || 'A'); set('scene', q.get('scene') || 'light'); set('w', q.get('w') || 'wide');
for (const k of ['dir', 'scene', 'w']) document.getElementById('sg-' + k).onclick = e => e.target.dataset.v && set(k, e.target.dataset.v);
</script>
</body>
</html>
